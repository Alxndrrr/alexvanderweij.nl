<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#18120b">
    <title>Alex van der Weij</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #18120b;
        --foreground: #ffbd37;
        --shadow: #ff0073;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Georgia,
          "Times New Roman",
          serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        margin: 0;
        padding: 1rem;
        font-size: clamp(3rem, 9vw, 6rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0;
        text-align: center;
        text-shadow: 0.04em 0.04em 0 var(--shadow);
      }

      @media (max-width: 43.99rem) {
        h1 {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Alex van der Weij</h1>
  </body>
</html>
