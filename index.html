<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#18120b">
    <title>Alex van der Weij</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    >
    <style>
      :root {
        color-scheme: dark;
        --background: #18120b;
        --foreground: #ffbd37;
        --shadow: #ff0073;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family:
          "Press Start 2P",
          ui-monospace,
          monospace;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        margin: 0;
        padding: 1rem;
        font-size: clamp(1.5rem, 5vw, 3rem);
        font-weight: 400;
        line-height: 1.35;
        letter-spacing: 0;
        text-align: center;
        text-shadow: 0.04em 0.04em 0 var(--shadow);
      }

      @media (max-width: 43.99rem) {
        h1 {
          font-size: clamp(1rem, 6.4vw, 1.45rem);
        }
      }
    </style>
  </head>
  <body>
    <h1>Alex van der Weij</h1>
  </body>
</html>
