    <script>
      try {
        const savedTheme = window.localStorage?.getItem("theme");

        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {
        document.documentElement.removeAttribute("data-theme");
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "url": "https://www.alexvanderweij.nl/",
        "name": "Alex van der Weij",
        "mainEntity": {
          "@type": "Person",
          "@id": "https://www.alexvanderweij.nl/#alex-van-der-weij",
          "name": "Alex van der Weij",
          "url": "https://www.alexvanderweij.nl/",
          "sameAs": [
            "https://alexx.fyi/",
            "https://www.threads.net/@alexx.fyi"
          ]
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffbd37;
        --foreground: #18120b;
        --purple: #5200ff;
        --pink: #ff0073;
        --deep: #2300ad;
        --focus: #ffffff;
        --theme-icon: "\f186";
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #18120b;
          --foreground: #ffbd37;
          --purple: #9b67ff;
          --pink: #ff4fa0;
          --deep: #ffbd37;
          --focus: #ff0073;
          --theme-icon: "\f185";
        }
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background: #ffbd37;
        --foreground: #18120b;
        --purple: #5200ff;
        --pink: #ff0073;
        --deep: #2300ad;
        --focus: #ffffff;
        --theme-icon: "\f186";
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #18120b;
        --foreground: #ffbd37;
        --purple: #9b67ff;
        --pink: #ff4fa0;
        --deep: #ffbd37;
        --focus: #ff0073;
        --theme-icon: "\f185";
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--background);
      }

      body {
        height: 100vh;
        height: 100svh;
        margin: 0;
        display: grid;
        justify-items: center;
        align-items: start;
        overflow: hidden;
        padding-top: clamp(3rem, calc(30svh - 6.75rem), 8rem);
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      .theme-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 2rem;
        height: 2rem;
        display: inline-grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--foreground);
        cursor: pointer;
        font: inherit;
        opacity: 0.72;
        transition:
          color 160ms ease,
          opacity 160ms ease,
          transform 160ms ease;
      }

      .theme-toggle::before {
        content: var(--theme-icon);
        font-family: "Font Awesome 6 Free";
        font-size: 1rem;
        font-weight: 900;
      }

      .theme-toggle:hover {
        color: var(--deep);
        opacity: 1;
        transform: translateY(-2px);
      }

      .theme-toggle:focus-visible {
        border-radius: 0.25rem;
        outline: 2px solid var(--focus);
        outline-offset: 0.25rem;
      }

      main {
        width: min(100%, 42rem);
        padding: 2rem 1.25rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--deep);
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: clamp(1.85rem, 7.8vw, 4.55rem);
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0;
        text-shadow:
          0.09em 0.09em 0 var(--pink),
          0.18em 0.18em 0 var(--purple);
        text-transform: uppercase;
      }

      .socials {
        display: flex;
        justify-content: center;
        gap: 0.875rem;
        margin-top: 1.75rem;
      }

      .social-link {
        width: 3rem;
        height: 3rem;
        display: inline-grid;
        place-items: center;
        border: 2px solid currentColor;
        border-radius: 50%;
        background: var(--background);
        color: var(--deep);
        text-decoration: none;
        font-size: 1.2rem;
        box-shadow: 0.2rem 0.2rem 0 var(--purple);
        transition:
          background-color 160ms ease,
          color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .social-link:nth-child(2) {
        color: var(--purple);
        box-shadow: 0.2rem 0.2rem 0 var(--pink);
      }

      .social-link:nth-child(3) {
        color: var(--pink);
        box-shadow: 0.2rem 0.2rem 0 var(--deep);
      }

      .social-link:hover {
        background: currentColor;
        transform: translateY(-2px);
      }

      .social-link:hover i {
        color: var(--background);
      }

      .social-link:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }

      @media (min-width: 44rem) {
        body {
          place-items: center;
          padding-top: 0;
        }

        main {
          padding: 3rem 2rem;
        }

        .socials {
          gap: 1rem;
          margin-top: 2rem;
        }

        .social-link {
          width: 3.4rem;
          height: 3.4rem;
          font-size: 1.35rem;
        }

        .theme-toggle {
          top: 1.5rem;
          right: 1.5rem;
        }
      }

      @media (max-width: 24rem) {
        h1 {
          font-size: clamp(1.45rem, 8.5vw, 1.85rem);
        }
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Donkere modus"></button>
    <main aria-label="Alex van der Weij">
      <h1>Alex van der Weij</h1>
      <nav class="socials" aria-label="Sociale links">
        <a
          class="social-link"
          href="https://alexx.fyi/"
          aria-label="Blog van Alex van der Weij"
          title="Blog"
        >
          <i class="fa-solid fa-rss" aria-hidden="true"></i>
        </a>
        <a
          class="social-link"
          href="https://www.threads.net/@alexx.fyi"
          aria-label="Alex van der Weij op Threads"
          title="Threads"
        >
          <i class="fa-brands fa-threads" aria-hidden="true"></i>
        </a>
        <a
          class="social-link"
          href="#"
          data-email-user="hoi"
          data-email-domain="alexvanderweij.nl"
          aria-label="Mail Alex van der Weij"
          title="Email"
        >
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        </a>
      </nav>
    </main>
    <script>
      const themeToggle = document.querySelector(".theme-toggle");
      const emailLink = document.querySelector("[data-email-user][data-email-domain]");
      const themePreference = window.matchMedia("(prefers-color-scheme: dark)");

      const saveTheme = (theme) => {
        try {
          window.localStorage?.setItem("theme", theme);
        } catch {
          return;
        }
      };

      const getActiveTheme = () => {
        return document.documentElement.dataset.theme
          || (themePreference.matches ? "dark" : "light");
      };

      const updateThemeToggle = () => {
        if (!themeToggle) {
          return;
        }

        const nextTheme = getActiveTheme() === "dark" ? "light" : "dark";
        themeToggle.setAttribute(
          "aria-label",
          nextTheme === "dark" ? "Donkere modus" : "Lichte modus"
        );
      };

      themeToggle?.addEventListener("click", () => {
        const nextTheme = getActiveTheme() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        saveTheme(nextTheme);
        updateThemeToggle();
      });

      themePreference.addEventListener("change", updateThemeToggle);
      updateThemeToggle();

      if (emailLink) {
        const address = `${emailLink.dataset.emailUser}@${emailLink.dataset.emailDomain}`;
        emailLink.href = `mailto:${address}`;
      }
    </script>
  </body>
</html>
