    <style>
      :root {
        color-scheme: light;
        --background: #ffbd37;
        --foreground: #18120b;
        --purple: #5200ff;
        --pink: #ff0073;
        --deep: #2300ad;
        --focus: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--background);
      }

      body {
        height: 100vh;
        height: 100svh;
        margin: 0;
        display: grid;
        justify-items: center;
        align-items: start;
        overflow: hidden;
        padding-top: clamp(3rem, calc(25svh - 6.75rem), 8rem);
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 42rem);
        padding: 2rem 1.25rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--deep);
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: clamp(1.85rem, 7.8vw, 4.55rem);
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0;
        text-shadow:
          0.09em 0.09em 0 var(--pink),
          0.18em 0.18em 0 var(--purple);
        text-transform: uppercase;
      }

      .socials {
        display: flex;
        justify-content: center;
        gap: 0.875rem;
        margin-top: 1.75rem;
      }

      .social-link {
        width: 3rem;
        height: 3rem;
        display: inline-grid;
        place-items: center;
        border: 2px solid currentColor;
        border-radius: 50%;
        background: var(--background);
        color: var(--deep);
        text-decoration: none;
        font-size: 1.2rem;
        box-shadow: 0.2rem 0.2rem 0 var(--purple);
        transition:
          background-color 160ms ease,
          color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .social-link:nth-child(2) {
        color: var(--purple);
        box-shadow: 0.2rem 0.2rem 0 var(--pink);
      }

      .social-link:nth-child(3) {
        color: var(--pink);
        box-shadow: 0.2rem 0.2rem 0 var(--deep);
      }

      .social-link:hover {
        background: currentColor;
        transform: translateY(-2px);
      }

      .social-link:hover i {
        color: var(--background);
      }

      .social-link:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }

      @media (min-width: 44rem) {
        body {
          place-items: center;
          padding-top: 0;
        }

        main {
          padding: 3rem 2rem;
        }

        .socials {
          gap: 1rem;
          margin-top: 2rem;
        }

        .social-link {
          width: 3.4rem;
          height: 3.4rem;
          font-size: 1.35rem;
        }
      }

      @media (max-width: 24rem) {
        h1 {
          font-size: clamp(1.45rem, 8.5vw, 1.85rem);
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Alex van der Weij">
      <h1>Alex van der Weij</h1>
      <nav class="socials" aria-label="Sociale links">
        <a
          class="social-link"
          href="https://alexx.fyi/"
          aria-label="Blog van Alex van der Weij"
          title="Blog"
        >
          <i class="fa-solid fa-rss" aria-hidden="true"></i>
        </a>
        <a
          class="social-link"
          href="https://www.threads.net/@alexx.fyi"
          aria-label="Alex van der Weij op Threads"
          title="Threads"
        >
          <i class="fa-brands fa-threads" aria-hidden="true"></i>
        </a>
        <a
          class="social-link"
          href="mailto:hoi@alexvanderweij.nl"
          aria-label="Mail Alex van der Weij"
          title="Email"
        >
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        </a>
      </nav>
    </main>
  </body>
</html>
