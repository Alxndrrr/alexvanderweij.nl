<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alex van der Weij</title>
    <meta
      name="description"
      content="Alex van der Weij. Blog, Threads en contact."
    >
    <meta name="author" content="Alex van der Weij">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://alxndrrr.github.io/alexvanderweij.nl/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Alex van der Weij">
    <meta property="og:title" content="Alex van der Weij">
    <meta
      property="og:description"
      content="Alex van der Weij. Blog, Threads en contact."
    >
    <meta property="og:url" content="https://alxndrrr.github.io/alexvanderweij.nl/">
    <meta property="og:locale" content="nl_NL">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Alex van der Weij">
    <meta
      name="twitter:description"
      content="Alex van der Weij. Blog, Threads en contact."
    >

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    >
    <style>
      :root {
        color-scheme: light;
        --background: #ffbd37;
        --foreground: #18120b;
        --focus: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 42rem);
        padding: 2rem 1.25rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 16vw, 7rem);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .socials {
        display: flex;
        justify-content: center;
        gap: 0.875rem;
        margin-top: 1.75rem;
      }

      .social-link {
        width: 3rem;
        height: 3rem;
        display: inline-grid;
        place-items: center;
        border: 2px solid currentColor;
        border-radius: 50%;
        color: inherit;
        text-decoration: none;
        font-size: 1.2rem;
        transition:
          background-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .social-link:hover {
        background: var(--foreground);
        color: var(--background);
        transform: translateY(-2px);
      }

      .social-link:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }

      @media (min-width: 44rem) {
        main {
          padding: 3rem 2rem;
        }

        .socials {
          gap: 1rem;
          margin-top: 2rem;
        }

        .social-link {
          width: 3.4rem;
          height: 3.4rem;
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Alex van der Weij">
      <h1>Alex van der Weij</h1>
      <nav class="socials" aria-label="Sociale links">
        <a
          class="social-link"
          href="https://alexx.fyi/"
          aria-label="Blog van Alex van der Weij"
          title="Blog"
        >
          <i class="fa-solid fa-rss" aria-hidden="true"></i>
        </a>
        <a
          class="social-link"
          href="https://www.threads.net/@alexx.fyi"
          aria-label="Alex van der Weij op Threads"
          title="Threads"
        >
          <i class="fa-brands fa-threads" aria-hidden="true"></i>
        </a>
        <a
          class="social-link"
          href="mailto:hoi@alexvanderweij.nl"
          aria-label="Mail Alex van der Weij"
          title="Email"
        >
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        </a>
      </nav>
    </main>
  </body>
</html>
